<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="./assets/css/form.css" />

  <title>Le formulaire</title>
</head>
<body>
  <form action="./" method="get"> <!-- enctype="multipart/form-data" -->
    <fieldset class="group">
      <legend>Mes coordonées</legend>
      <div class="inputGroup">
        <label for="surname">Prénom</label>
        <input id="surname" type="text" name="prenom" required />
      </div>
      <div class="inputGroup">
        <label for="name">Nom</label>
        <input id="name" type="text" name="nom" required />
      </div>
      <div class="inputGroup">
        <label for="mail">Email</label>
        <input id="mail" type="email" name="mail" required />
      </div>
      <div class="inputGroup">
        <input type="password" name="pass" id="" />
      </div>
    </fieldset>
    <fieldset class="group">
      <legend>Ma demande</legend>
      <select id="demand" name="object" required>
        <option value="">----</option>
        <option value="contact">Je veut être recontacté</option>
        <option value="price">Je veut un devis</option>
        <option value="info">Je veut plus d'information</option>
      </select>
      <textarea required name="message" id="message" placeholder="Votre message" maxlength="10" minlength="1"></textarea>
    </fieldset>
    <div class="group">
      <input type="submit" value="Valider le formulaire" />
    </div>
  </form>
</body>
</html>
