<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="./assets/css/form.css" />

  <title>Le formulaire</title>
</head>
<body>
  <form action="./" method="get"> <!-- enctype="multipart/form-data" -->
    <fieldset class="group">
      <legend>Mes coordonées</legend>
      <div class="inputGroup">
        <label for="surname">Prénom</label>
        <span>span</span>
        <input id="surname" type="text" name="prenom" required />
      </div>
      <div class="inputGroup">
        <label for="name">Nom</label>
        <span>span</span>
        <input id="name" type="text" name="nom" required />
      </div>
      <div class="inputGroup">
        <label for="mail">Email</label>
        <span>span</span>
        <input id="mail" type="email" name="mail" required />
      </div>
    </fieldset>
    <fieldset class="group">
      <legend>Ma demande</legend>
      <select id="demand" multiple="true" name="object" required>
        <option value="">----</option>
        <optgroup label="Fruit">
          <option value="banane">Banane</option>
          <option value="fraise">Fraise</option>
        </optgroup>
        <optgroup label="Légumes">
          <option value="courgette">Courgette</option>
          <option value="choux">Choux</option>
        </optgroup>
      </select>
      <textarea required name="message" id="message" placeholder="Votre message" maxlength="10" minlength="1"></textarea>
    </fieldset>
    <div class="group">
      <input type="submit" value="Valider le formulaire" />
      <input type="button" value="">
      <input type="reset" value="reset">
    </div>
  </form>

  <section>
    <div>div1</div>
    <div>div2</div>
    <div>div3</div>
    <div>div4</div>
    <div>div5</div>
    <div>div6</div>
    <div>div7</div>
    <div>div8</div>
    <div>div9</div>
    <div>div10</div>
  </section>
</body>
</html>
