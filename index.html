<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <link rel="stylesheet" href="./assets/css/form.css" />

  <title>Flexbox</title>
</head>
<body>
  <header>
    <h1>Table</h1>
    <p>Les tableaux en html / css</p>
  </header>
  <main>
    <table>
      <thead> <!-- Entête de tableaux -->
      <tr> <!-- Ligne de tableau -->
        <th>Entête 1</th> <!-- Cellule d'entête de tableaux -->
        <th>Entête 2</th>
        <th>Entête 3</th>
      </tr>
      </thead>
      <tbody>
        <tr> <!-- Ligne de tableau -->
          <td colspan="3" rowspan="2">Colonne 1, 2 & 3</td>
        </tr>
        <tr>
        </tr>
        <tr>
          <td rowspan="2">Colonne 1</td> <!-- Cellule de tableau (à utiliser dans le corp ou le pied de tableau, mais pas dans l'entête) -->
          <td>Colonne 2</td>
          <td>Colonne 3</td>
        </tr>
        <tr>
          <td>Colonne 2</td>
          <td>Colonne 3</td>
        </tr>

      </tbody>
      <tfoot>
        <tr>
          <td>Pied de colonne 1</td>
          <td>Pied de colonne 2</td>
          <td>Pied de colonne 3</td>
        </tr>
      </tfoot>
    </table>
  </main>
</body>
</html>
